<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">

<title>یخ‌زده - بقا در برابر زامبی‌ها</title>
<style>
html,body{margin:0;height:100%;background:#111;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;font-family:Tahoma,system-ui,sans-serif;color:#fff}
canvas{position:fixed;left:0;top:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
#hud{position:fixed;left:8px;top:calc(8px + env(safe-area-inset-top));direction:ltr;display:flex;flex-direction:column;gap:4px;pointer-events:none}
.bar{display:flex;align-items:center;gap:5px;font-size:14px}
.bar i{font-style:normal;width:18px;text-align:center}
.bar b{display:block;width:80px;height:7px;background:#0007;border:1px solid #000a;border-radius:2px;overflow:hidden}
.bar u{display:block;height:100%;width:100%;text-decoration:none}
#info{position:fixed;right:8px;top:calc(8px + env(safe-area-inset-top));background:#0006;padding:4px 9px;border-radius:6px;font-size:13px;pointer-events:none}
#inv{position:fixed;right:8px;top:calc(46px + env(safe-area-inset-top));display:flex;flex-direction:column;gap:5px;direction:ltr}
#inv button{background:#000a;border:1px solid #fff4;color:#fff;border-radius:8px;padding:5px 9px;font-size:15px;min-width:62px;text-align:left}
#inv button:active{background:#fff3}
#btns{position:fixed;right:14px;bottom:calc(18px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(2,64px);gap:10px;direction:ltr}
#btns button{width:64px;height:64px;border-radius:50%;border:2px solid #fff6;background:#0008;color:#fff;font-size:26px;position:relative}
#btns button:active{background:#fff4}
#btns small{position:absolute;bottom:2px;left:0;right:0;font-size:11px}
#bAct{grid-column:1 / span 2;justify-self:center}
#toast{position:fixed;left:50%;top:22%;transform:translateX(-50%);background:#000b;padding:8px 14px;border-radius:8px;font-size:15px;opacity:0;transition:opacity .3s;pointer-events:none;text-align:center;max-width:80%}
#joy{position:fixed;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;border:2px solid #fff5;background:#fff1;display:none;pointer-events:none}
#knob{position:absolute;left:35px;top:35px;width:40px;height:40px;border-radius:50%;background:#fff6}
#menu{position:fixed;inset:0;background:linear-gradient(#0b1220ee,#1b1d22f5);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px}
#menu h1{font-size:34px;margin:0;color:#dfe9f2;text-shadow:0 0 14px #5aa0ff}
#menu p{margin:0;color:#b8c4d0;font-size:15px;max-width:340px;line-height:1.9}
#menu button{background:#2f6fa8;color:#fff;border:0;border-radius:10px;font-size:18px;padding:12px 30px;font-family:inherit}
#menu button.alt{background:#444}
.bar em{font-style:normal;font-size:11px;min-width:24px}
.low{animation:bl .5s infinite alternate}@keyframes bl{to{opacity:.35}}
#bPause{position:fixed;left:50%;top:calc(8px + env(safe-area-inset-top));transform:translateX(-50%);background:#0007;border:1px solid #fff4;color:#fff;border-radius:8px;padding:3px 12px;font-size:15px}
#craft{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:#10151cf2;border:1px solid #fff4;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:7px;min-width:240px;max-width:90%}
#craft button{background:#2b3745;color:#fff;border:1px solid #fff3;border-radius:8px;padding:8px 10px;font-size:14px;font-family:inherit}
#craft button:disabled{opacity:.4}#craft h3{margin:0;font-size:15px;text-align:center}#craft small{color:#aab;font-size:12px;text-align:center}
#craft{max-height:82vh;overflow:auto}
#set{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:#10151cf8;border:1px solid #fff4;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:250px;max-width:90%}
#set h3{margin:0;text-align:center;font-size:16px}#set label{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px}#set input{width:110px}
#set button{background:#2b3745;color:#fff;border:1px solid #fff3;border-radius:8px;padding:8px 10px;font-size:14px;font-family:inherit}
#mm{left:8px;top:auto;bottom:calc(8px + env(safe-area-inset-bottom));width:96px;height:96px;border-radius:50%;background:#0009;border:1px solid #fff4;pointer-events:none}
#boss{position:fixed;left:50%;top:calc(44px + env(safe-area-inset-top));transform:translateX(-50%);width:170px;height:10px;background:#000a;border:1px solid #fff5;border-radius:3px;overflow:hidden;pointer-events:none}#boss u{display:block;height:100%;background:#c22;text-decoration:none}
body.lefty #btns{right:auto;left:14px}body.lefty #mm{left:auto;right:8px}body.big #btns{grid-template-columns:repeat(2,80px)}body.big #btns button{width:80px;height:80px;font-size:32px}#btns{gap:14px}#set{max-height:85vh;overflow:auto}
.hide{display:none!important}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div class="bar"><i>❤️</i><b><u id="bHp" style="background:#d33"></u></b><em id="tHp"></em></div>
  <div class="bar"><i>🍖</i><b><u id="bFood" style="background:#d9902f"></u></b><em id="tFood"></em></div>
  <div class="bar"><i>💧</i><b><u id="bWater" style="background:#3aa0e0"></u></b><em id="tWater"></em></div>
  <div class="bar"><i>🌡️</i><b><u id="bWarm" style="background:#e8e050"></u></b><em id="tWarm"></em></div>
  <div class="bar"><i>🏃</i><b><u id="bSt" style="background:#7bd66a"></u></b><em id="tSt"></em></div>
  <div class="bar"><i>🔊</i><b><u id="bNz" style="background:#9c9"></u></b><em></em></div>
</div>
<div id="info">روز <span id="day">1</span> · 🧟 <span id="kills">0</span> · <span id="clock">☀️</span> <span id="wp"></span></div>
<div id="inv">
  <button id="iFood">🥫 <span id="nFood">0</span></button>
  <button id="iWater">🧃 <span id="nWater">0</span></button>
  <button id="iBand">🩹 <span id="nBand">0</span></button>
  <button id="iFire">🔥 <span id="nWood">0</span>🪵</button>
  <button id="iCraft">🔨</button>
  <button id="iSneak">🥷</button>
</div>
<div id="btns">
  <button id="bAtk">⚔️</button>
  <button id="bShoot">🔫<small id="nAmmo">0</small></button>
  <button id="bAct">✋</button>
</div>
<div id="joy"><div id="knob"></div></div>
<div id="toast"></div>
<canvas id="mm" width="96" height="96"></canvas>
<div id="boss" class="hide"><u></u></div>
<button id="bPause">⏸</button><div id="craft" class="hide"></div>
<div id="menu">
  <h1>❄️ یخ‌زده ❄️</h1>
  <p id="mText">دنیا زیر برف دفن شده و مرده‌ها راه می‌روند. خانه‌ها، ماشین‌ها و کوله‌ها را بگرد، آتش روشن کن، گرسنگی و سرما را تحمل کن و تا می‌توانی زنده بمان.<br>
  <small>چپ صفحه: حرکت · ⚔️ ضربه/قطع درخت · 🔫 شلیک · ✋ جستجو<br>کیبورد: WASD، J، K، E</small></p>
  <div id="mBest" style="color:#8fb4d6;font-size:14px"></div>
  <button id="bContinue" class="hide">ادامه بازی</button>
  <button id="bNew">بازی جدید</button>
  <button id="bSet" class="alt">⚙️ تنظیمات</button>
</div>
<div id="set" class="hide"></div>

<script>
(()=>{
"use strict";
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
const CS=256,DAY=300,SAVE='frozen_save_v2';
let dbg=false,W=1,H=1,Z=3,DPR=1,seed=1,S=null,running=false;
const nc=document.createElement('canvas'),nx=nc.getContext('2d');

const ST=(()=>{let s={vol:.6,sens:1,q:1,dif:1,lefty:0,big:0};try{Object.assign(s,JSON.parse(localStorage.getItem('frozen_set')))}catch(e){}return s})();
function resize(){
  const dpr=window.devicePixelRatio||1,k=Math.max(1,Math.ceil(dpr/(ST.q?2:1.2)));DPR=dpr/k;
  W=cv.width=Math.floor(innerWidth*dpr/k);H=cv.height=Math.floor(innerHeight*dpr/k);cv.style.width=(W*k/dpr)+'px';cv.style.height=(H*k/dpr)+'px';
  nc.width=W;nc.height=H;
  Z=Math.max(2,Math.round(W/300));
}
addEventListener('resize',resize);resize();

/* ---------- random ---------- */
function Hs(a,b,c){let h=(Math.imul(a|0,374761393)+Math.imul(b|0,668265263)+Math.imul(c|0,1274126177))|0;h=Math.imul(h^(h>>>13),1274126177);return (h^(h>>>16))>>>0}
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ---------- sprites (pixel art drawn in code) ---------- */
function mk(w,h,f){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');const R=(x,y,ww,hh,col)=>{g.fillStyle=col;g.fillRect(x,y,ww,hh)};f(R,g);return c}
function ell(R,cx,cy,rx,ry,col,colEdge){for(let y=-ry;y<=ry;y++){const half=Math.round(rx*Math.sqrt(1-(y*y)/(ry*ry+0.01)));R(cx-half,cy+y,half*2,1,col);if(colEdge){R(cx-half,cy+y,1,1,colEdge);R(cx+half-1,cy+y,1,1,colEdge)}}}
const SPR={};
SPR.ptree=mk(22,32,(R)=>{
  R(10,25,3,7,'#4b3322');
  const L=[[2,8],[9,9],[17,10]];
  L.forEach((l,i)=>{for(let r=0;r<l[1];r++){const half=2+Math.floor(r*0.95)+i*2;const y=l[0]+r;
    const col=r<2?'#eef1f3':(r%3===0?'#2a4232':'#35523f');
    R(11-half,y,half*2,1,col);R(11-half,y,1,1,'#223628');R(10+half,y,1,1,'#223628');
    if(r>2&&r%4===1)R(11-half+2,y,2,1,'#e6eaec');}});
});
SPR.tree=mk(26,32,(R)=>{
  R(12,20,3,12,'#5b3d2a');R(11,20,1,12,'#4a3022');
  ell(R,13,12,11,10,'#7a4a3a','#5e382c');
  ell(R,13,7,9,5,'#eef1f3');
  ell(R,9,14,3,2,'#8f5a47');ell(R,18,15,3,2,'#66402f');
});
SPR.rock=mk(14,10,(R)=>{ell(R,7,6,6,4,'#aeb4b9','#8b9196');ell(R,7,4,5,3,'#e9ecee');R(3,8,8,1,'#8b9196')});
SPR.tuft=mk(8,6,(R)=>{R(1,2,1,4,'#8f935d');R(3,0,1,6,'#a2a56b');R(5,2,1,4,'#8f935d');R(6,3,1,3,'#7b7f4e')});
SPR.stump=mk(9,7,(R)=>{R(1,3,7,4,'#6e4a30');R(1,2,7,2,'#eef1f3');R(2,1,5,1,'#fff')});
SPR.bag=mk(10,9,(R)=>{R(1,2,8,7,'#5a6b3a');R(2,0,6,3,'#4a5a30');R(3,4,4,3,'#3d4a28');R(0,3,1,5,'#3d4a28');R(9,3,1,5,'#3d4a28');R(2,1,6,1,'#eef1f3')});
SPR.house=mk(46,38,(R)=>{
  R(0,0,46,14,'#848a92');R(0,0,46,3,'#eef1f3');R(0,7,46,1,'#6a6f77');R(0,13,46,1,'#5d626a');
  R(3,3,10,2,'#eef1f3');R(28,4,12,2,'#eef1f3');
  R(1,14,44,24,'#9a4d42');
  for(let y=18;y<38;y+=4)R(1,y,44,1,'#7a3b33');
  for(let y=16;y<38;y+=8)for(let x=4;x<44;x+=9)R(x,y,1,4,'#7a3b33');
  R(6,20,9,9,'#d9d6cf');R(7,21,7,7,'#1f2832');R(10,21,1,7,'#d9d6cf');R(7,24,7,1,'#d9d6cf');
  R(31,20,9,9,'#d9d6cf');R(32,21,7,7,'#1f2832');R(35,21,1,7,'#d9d6cf');R(32,24,7,1,'#d9d6cf');
  R(19,22,9,16,'#4a2f1b');R(20,23,7,15,'#5f3d24');R(25,30,1,2,'#d8b24a');
  R(0,36,46,2,'#eef1f3');
});
const CARC=[['#2f6fa8','#23547f'],['#a88f5e','#7f6c47'],['#6b6a45','#4d4c31']];
SPR.car=CARC.map(c=>mk(32,20,(R)=>{
  R(4,16,6,3,'#1d1d1d');R(22,16,6,3,'#1d1d1d');
  R(1,6,30,11,c[0]);R(1,15,30,2,c[1]);
  R(5,1,22,7,c[1]);R(5,1,22,2,'#eef1f3');
  R(7,3,8,4,'#a9c7d6');R(17,3,8,4,'#a9c7d6');R(15,3,2,4,c[1]);
  R(1,9,3,2,'#e8d27a');R(28,9,3,2,'#c33');
  R(8,8,4,2,'#eef1f3');R(18,7,5,2,'#eef1f3');R(3,6,3,1,'#eef1f3');
  R(0,12,1,3,'#777');R(31,12,1,3,'#777');
}));
function person(skin,hat,jacket,pants,extra,frame,arms){
  return mk(14,18,(R)=>{
    const lf=frame===0?0:1,rf=frame===0?1:0;
    R(4,13+lf,2,5-lf,pants);R(8,13+rf,2,5-rf,pants);R(4,17,2,1,'#222');R(8,17,2,1,'#222');
    R(3,7,8,7,jacket);R(3,12,8,1,'#00000033');
    if(arms){R(10,8,4,2,skin);R(0,8,3,2,jacket)}else{R(2,8,1,5,jacket);R(11,8,1,5,jacket)}
    R(4,2,6,5,skin);R(4,1,6,2,hat);R(3,2,1,2,hat);
    extra(R);
  });
}
SPR.player=[0,1].map(f=>person('#e0b48f','#3b3f46','#4a6b3a','#2d3340',(R)=>{R(5,4,1,1,'#222');R(8,4,1,1,'#222');R(11,8,3,6,'#6b4f2a')},f,false));
SPR.zombie=[0,1].map(f=>person('#8fae7a','#4a3b3b','#5d4a52','#3c3a44',(R)=>{R(5,4,1,1,'#d22');R(8,4,1,1,'#d22');R(5,6,4,1,'#3a1818');R(3,10,2,2,'#8fae7a')},f,true));
SPR.zombie2=[0,1].map(f=>person('#a6b878','#222','#7a3a3a','#2a2a30',(R)=>{R(5,4,1,1,'#f33');R(8,4,1,1,'#f33');R(5,6,4,1,'#3a1818');R(4,9,3,2,'#c44')},f,true));
SPR.zombie3=[0,1].map(f=>person('#b5c94a','#2a3a1a','#4d6b2a','#2a3a30',(R)=>{R(5,4,1,1,'#ff0');R(8,4,1,1,'#ff0');R(5,6,4,2,'#9acd32')},f,true));
SPR.zombie4=[0,1].map(f=>person('#c98a6a','#aa2222','#b33a2a','#3a2a2a',(R)=>{R(5,4,1,1,'#fff');R(8,4,1,1,'#fff');R(3,9,8,2,'#ffcc00')},f,true));
SPR.bat=[0,1].map(f=>mk(12,8,(R)=>{R(5,3,2,3,'#3a2a44');R(1,f?1:3,4,2,'#2a1a33');R(7,f?1:3,4,2,'#2a1a33');R(5,2,1,1,'#f44');R(6,2,1,1,'#f44')}));
SPR.raider=[0,1].map(f=>person('#d9b08c','#aa3322','#3a3a5a','#2a2a30',(R)=>{R(5,4,1,1,'#222');R(8,4,1,1,'#222');R(11,9,3,2,'#999');R(4,2,6,1,'#222')},f,true));
SPR.poi=[0,1,2].map(v=>mk(46,38,(R)=>{
  if(v===0){R(0,12,46,3,'#c8472f');R(2,15,2,18,'#777');R(42,15,2,18,'#777');R(8,24,30,12,'#b9b9b9');R(12,26,8,10,'#e03a3a');R(26,26,8,10,'#e03a3a');R(0,36,46,2,'#eef1f3');R(0,10,46,2,'#eef1f3')}
  else if(v===1){R(1,8,44,30,'#e9edf0');R(0,6,46,3,'#eef1f3');R(18,12,10,10,'#d33');R(21,10,4,14,'#fff');R(15,15,16,4,'#fff');R(18,26,10,12,'#7a8a95');R(5,16,7,7,'#6a9ab0');R(34,16,7,7,'#6a9ab0')}
  else{R(1,10,44,28,'#4d5a3a');R(0,6,46,5,'#3a4530');R(0,6,46,2,'#eef1f3');R(6,16,8,8,'#222');R(32,16,8,8,'#222');R(18,22,10,16,'#2c3320');R(20,12,6,4,'#c33')}}));
SPR.dog=mk(12,8,(R)=>{R(2,2,7,4,'#a8794a');R(8,1,3,3,'#a8794a');R(10,2,1,1,'#222');R(0,1,2,1,'#8a5f38');R(2,6,1,2,'#7a5230');R(7,6,1,2,'#7a5230');R(8,0,1,2,'#7a5230')});
SPR.cave=mk(26,18,(R)=>{ell(R,13,11,12,7,'#7b8088','#5c6168');ell(R,13,6,10,4,'#e9ecee');ell(R,13,13,5,4,'#0e0f12')});
function zs(z){return z.ty===5?SPR.bat:z.ty===6?SPR.zombie2:z.ty===7?SPR.raider:z.ty===3?SPR.zombie3:z.ty===4?SPR.zombie4:(z.v?SPR.zombie2:SPR.zombie)}
const FLAKE_N=90,flakes=[];for(let i=0;i<FLAKE_N;i++)flakes.push({x:Math.random(),y:Math.random(),s:.04+Math.random()*.08,w:Math.random()*6});

/* ground pattern */
const ground=(()=>{const r=rng(7);const c=mk(64,64,(R)=>{R(0,0,64,64,'#cfcfca');
  for(let i=0;i<180;i++){const x=r()*64|0,y=r()*64|0;R(x,y,1+(r()*2|0),1,r()<.5?'#bdbdb8':'#e0e0db')}
  for(let i=0;i<7;i++){const x=r()*62|0,y=r()*62|0;R(x,y,2,1,'#a3a3a0');R(x,y+1,1,1,'#8f8f8c')}
  for(let i=0;i<5;i++){const x=r()*60|0,y=r()*60|0;R(x,y,3,1,'#f2f2ee')}});
  return ctx.createPattern(c,'repeat')})();

/* ---------- world ---------- */
const chunks=new Map();
function isRoad(cy){return Hs(cy,seed,77)%4===0}
function chunk(cx,cy){const k=cx+','+cy;let c=chunks.get(k);if(!c){c=genChunk(cx,cy);chunks.set(k,c)}return c}
function genChunk(cx,cy){
  const r=rng(Hs(cx,cy,seed)),o=[],ox=cx*CS,oy=cy*CS,road=isRoad(cy);
  const bio=Hs(cx,cy,seed+11)%6,forest=bio<2,meadow=bio===2,town=bio===3,tufts=[];
  const ok=(x,y,m)=>{
    if(road&&y>92&&y<156)return false;
    const wx=ox+x,wy=oy+y;if(Math.hypot(wx,wy)<60)return false;
    for(const q of o){if(q.t==='tuft')continue;
      const hs=q.t==='house'||q.t==='poi',rx=hs?30:q.t==='car'?20:9,ry=hs?24:q.t==='car'?12:7;
      if(Math.abs(q.x-wx)<m+rx&&Math.abs(q.y-wy)<m+ry)return false}
    return true};
  const put=(t,x,y,e)=>{const q=Object.assign({t,x:ox+x,y:oy+y,id:cx+','+cy+','+o.length},e||{});q.b=box(q);o.push(q)};
  for(let n=0;n<(town?3:1);n++){if(r()<(town?0.9:forest?0.12:0.42)){for(let i=0;i<8;i++){const x=34+r()*(CS-68),y=50+r()*(CS-64);if(ok(x,y,6)){put('house',x,y);break}}}}
  const nc2=(r()<0.5?(r()<0.4?2:1):0)+(town&&r()<.6?1:0);
  for(let n=0;n<nc2;n++){for(let i=0;i<10;i++){const x=20+r()*(CS-40);let y=road?(118+r()*28):(20+r()*(CS-30));

  for(const q of S.sm){ctx.fillStyle=q.k==='b'?'rgba(255,255,255,'+Math.min(.6,q.t*.6)+')':'rgba(90,90,95,'+Math.min(.35,q.t*.3)+')';ctx.fillRect(Math.round(q.x),Math.round(q.y),2,2)}
  for(const f of S.fx){ctx.fillStyle='#fff6b0';ctx.fillRect(Math.round(f.x)-2,Math.round(f.y)-2,4,4)}
  for(const d of S.dead){const im=zs(d)[0],sc=d.sc;ctx.save();ctx.globalAlpha=Math.max(0,d.t/.5);ctx.translate(Math.round(d.x),Math.round(d.y));ctx.rotate((1-d.t/.5)*1.4*(d.f>0?1:-1));ctx.drawImage(im,-im.width*sc/2,-im.height*sc,im.width*sc,im.height*sc);ctx.restore()}
  ctx.fillStyle='#b22';for(const a of S.pt)ctx.fillRect(Math.round(a.x),Math.round(a.y),2,2);
  ctx.font='bold 9px Tahoma';ctx.textAlign='center';ctx.lineWidth=2;ctx.strokeStyle='#000';
  for(const a of S.dn){ctx.globalAlpha=Math.min(1,a.t*3);ctx.strokeText(a.v,a.x,a.y);ctx.fillStyle=a.c;ctx.fillText(a.v,a.x,a.y)}ctx.globalAlpha=1;
  if(dbg){ctx.lineWidth=1;ctx.strokeStyle='rgba(255,40,40,.8)';ctx.fillStyle='#f66';ctx.font='8px monospace';
    for(let cx=a;cx<=b;cx++)for(let cy=c;cy<=d;cy++){ctx.strokeRect(cx*CS+.5,cy*CS+.5,CS-1,CS-1);ctx.fillText(cx+','+cy+' '+chunk(cx,cy).bio,cx*CS+4,cy*CS+12)}}
  /* night */
  ctx.setTransform(1,0,0,1,0,0);
  if(dbg){ctx.fillStyle='#fff';ctx.font=`${12*DPR}px monospace`;ctx.textAlign='left';ctx.fillText('chunks loaded: '+chunks.size,10*DPR,H-10*DPR)}
  const night=S.cv?.85:nightAmt();
  if(night>0){nx.globalCompositeOperation='source-over';nx.clearRect(0,0,W,H);nx.fillStyle=`rgba(6,10,38,${(night*.66).toFixed(3)})`;nx.fillRect(0,0,W,H);
    nx.globalCompositeOperation='destination-out';
    const hole=(x,y,r,s)=>{nx.globalAlpha=s;nx.drawImage(LT,x-r,y-r,r*2,r*2);nx.globalAlpha=1};
    hole((p.x-camx)*Z,(p.y-8-camy)*Z,70*Z,.75);
    for(const f of S.fires)hole((f.x-camx)*Z,(f.y-6-camy)*Z,95*Z*(0.95+Math.random()*.05),.95);
    ctx.drawImage(nc,0,0)}
  {const ph=(S.time%DAY)/DAY,bell=(a,b,c)=>ph<a||ph>c?0:ph<b?(ph-a)/(b-a):(c-ph)/(c-b);
    const dusk=S.cv?0:bell(.46,.56,.66),dawn=S.cv?0:Math.max(bell(.86,.95,1.01),ph<.04?(.04-ph)/.04*.9:0);
    if(dusk>0){ctx.fillStyle='rgba(255,130,50,'+(dusk*.2).toFixed(3)+')';ctx.fillRect(0,0,W,H)}
    if(dawn>0){ctx.fillStyle='rgba(255,170,160,'+(dawn*.18).toFixed(3)+')';ctx.fillRect(0,0,W,H)}}
  /* cold & damage tint */
  if(p.warm<35){const a2=(35-p.warm)/35*.45;const g=ctx.createRadialGradient(W/2,H/2,H*.25,W/2,H/2,H*.8);g.addColorStop(0,'rgba(120,170,255,0)');g.addColorStop(1,`rgba(120,170,255,${a2})`);ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
  if(p.flash>0){ctx.fillStyle=`rgba(200,0,0,${Math.min(.35,p.flash)})`;ctx.fillRect(0,0,W,H)}
  /* snow */
  const nF=S.cv?0:(ST.q?flakes.length:30),sz=Math.max(2,Math.round(DPR*2));ctx.fillStyle='rgba(255,255,255,.85)';for(let i=0;i<nF;i++){const f=flakes[i];ctx.fillRect(Math.round(f.x*W),Math.round(f.y*H),sz,sz)}
  if(S.bz>0&&!S.cv){ctx.fillStyle='rgba(225,235,250,'+Math.min(.38,S.bz*.08,(45-S.bz)*.2+.02)+')';ctx.fillRect(0,0,W,H);ctx.fillStyle='rgba(255,255,255,.7)';const o2=(T*320*DPR)%W;for(let i=0;i<flakes.length;i++){const f=flakes[i];ctx.fillRect(Math.round((f.x*W+o2)%W),Math.round(f.y*H),sz*2,sz)}}
  /* label */
  if(S.search){const q=S.search,bx=(p.x-camx)*Z,by=(p.y-34-camy)*Z,w=60*DPR;ctx.fillStyle='#000a';ctx.fillRect(bx-w/2,by,w,7*DPR);ctx.fillStyle='#ffd45a';ctx.fillRect(bx-w/2,by,w*q.t/q.d,7*DPR)}
  if(tg){const sx=(tg.x-camx)*Z,sy=(tg.y-(tg.t==='house'||tg.t==='poi'?40:tg.t==='car'?22:12)-camy)*Z;ctx.font=`bold ${Math.round(13*DPR)}px Tahoma,sans-serif`;ctx.textAlign='center';
    const nm={house:'خانه · جستجو ✋',car:'ماشین · جستجو ✋',poi:'مکان ویژه · جستجو ✋',dog:'🐕 سگ · با کنسرو رام کن ✋',cave:'غار · ورود ✋',exit:'خروج از غار ✋',drop:'📦 محموله · جستجو ✋',chest:'صندوق · باز کردن ✋',bag:'کوله · جستجو ✋'}[tg.t];ctx.lineWidth=4*DPR;ctx.strokeStyle='#000a';ctx.strokeText(nm,sx,sy);ctx.fillStyle='#fff';ctx.fillText(nm,sx,sy)}
}

/* ---------- loop ---------- */
let last=0,dtS=.016;
function frame(t){
  requestAnimationFrame(frame);
  if(!S){ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#cfcfca';ctx.fillRect(0,0,W,H);return}
  const raw=Math.min(.05,(t-last)/1000||0);last=t;dtS+=(raw-dtS)*.25;const dt=dtS;CAMDT=dt||.016;if(running&&dt>.034)fpsT+=dt;else fpsT=Math.max(0,fpsT-dt);if(fpsT>5&&ST.q){ST.q=0;fpsT=0;sv();resize();toast('⚡ کیفیت برای روانی پایین آمد')}
  if(running)update(dt);
  render();
}
function start(cont){
  if(cont){if(!load())newState()}else newState();
  running=true;paused=false;$('mText').innerHTML=MT;$('menu').classList.add('hide');hud();toast(cont?'خوش برگشتی':'تا می‌توانی زنده بمان. اول درخت بزن 🪵 و خانه‌ها را بگرد');
  beep(400,.1,'sine');
}
$('bNew').addEventListener('click',()=>start(false));
$('bSet').addEventListener('click',()=>{setUI();$('set').classList.remove('hide');beep(500,.08,'sine')});
$('bContinue').addEventListener('click',()=>{if(paused){paused=false;running=true;$('menu').classList.add('hide')}else start(true)});
try{if(localStorage.getItem(SAVE))$('bContinue').classList.remove('hide')}catch(e){}
document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
addEventListener('pagehide',save);
/* menu background world */
newState();running=false;bestUpd();applyUI();
try{if("serviceWorker" in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register("sw.js").catch(()=>{})}catch(e){}
requestAnimationFrame(frame);
})();
</script>
